name: Tests

on:
  push:
    branches-ignore:
      - main
      - master
      - v*.*
  pull_request:
    branches-ignore:
      - main
      - master
      - v*.*
    types:
      - opened
      - reopened
      - synchronize

env:
  BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{env.BRANCH}}
      - run: cp .env.dist .env
      - uses: falti/dotenv-action@v1
        id: dotenv
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false

  semantic-release:
    needs:
      - docker-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{env.BRANCH}}
      - run: cp .env.dist .env
      - uses: falti/dotenv-action@v1
        id: dotenv
      - run: git fetch && git pull
      - uses: cycjimmy/semantic-release-action@v8.1.3
        id: semantic-release
        with:
          dry_run: true
          extra_plugins: |
            conventional-changelog-conventionalcommits@9
            conventional-changelog-writer@9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}